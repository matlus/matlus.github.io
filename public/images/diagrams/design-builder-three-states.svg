<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc"><title id="title">One property, three distinct arrangements</title><desc id="desc">No key uses a default; an explicit value or null is retained when the property key exists.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker></defs><rect width="1200" height="465" rx="20" fill="#f8faf8"/><text x="600" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243b53" text-anchor="middle" font-weight="600">One property, three distinct arrangements</text><rect x="48" y="116" width="340" height="100" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="45" y="110" width="340" height="100" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="215" y="141" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">No override</text><text x="215" y="168" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">dictionary has no property key</text><rect x="433" y="116" width="340" height="100" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="430" y="110" width="340" height="100" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="141" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Explicit value</text><text x="600" y="168" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">key exists → chosen value</text><rect x="818" y="116" width="340" height="100" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="815" y="110" width="340" height="100" rx="15" fill="#f9dfd7" stroke="#7191a8" stroke-width="1.5"/><text x="985" y="141" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Explicit null</text><text x="985" y="168" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">key exists → null</text><path d="M215 210 L215 298" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M600 210 L600 298" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M985 210 L985 298" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="48" y="306" width="340" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="45" y="300" width="340" height="80" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="215" y="331" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Generate a default</text><rect x="433" y="306" width="340" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="430" y="300" width="340" height="80" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="331" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Keep the chosen value</text><rect x="818" y="306" width="340" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="815" y="300" width="340" height="80" rx="15" fill="#f9dfd7" stroke="#7191a8" stroke-width="1.5"/><text x="985" y="331" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Keep null</text><text x="600" y="428" font-family="Arial,sans-serif" font-size="22" fill="#243b53" text-anchor="middle" font-weight="400">Ask whether the key exists, independently of its value.</text></svg>