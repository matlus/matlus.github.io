<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Movies and genres</title><desc id="desc">Movie has Id as primary key, unique Title, Year and ImageUrl. Genre has primary key Id and unique Title. AssocMovieGenre has MovieId and GenreId as its composite primary key, referencing Movie.Id and Genre.Id.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f8faf8" stroke="#50768a"/></marker></defs><rect width="1200" height="580" rx="16" fill="#f8faf8"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#243b53">Movies and genres</text><rect x="55" y="130" width="270" height="239" rx="7" fill="#fff0c8" stroke="#50768a" stroke-width="2"/><path d="M55 185 H325" stroke="#50768a"/><text x="190" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#243b53">Movie</text><line x1="55" y1="185" x2="325" y2="185" stroke="#c3d1d7"/><text x="75" y="216" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Id</text><text x="279" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">PK</text><line x1="55" y1="231" x2="325" y2="231" stroke="#c3d1d7"/><text x="75" y="262" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Title</text><text x="279" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">UQ</text><line x1="55" y1="277" x2="325" y2="277" stroke="#c3d1d7"/><text x="75" y="308" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Year</text><line x1="55" y1="323" x2="325" y2="323" stroke="#c3d1d7"/><text x="75" y="354" font-family="Arial,sans-serif" font-size="22" fill="#243b53">ImageUrl</text><rect x="465" y="305" width="290" height="147" rx="7" fill="#fff0c8" stroke="#50768a" stroke-width="2"/><path d="M465 360 H755" stroke="#50768a"/><text x="610" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#243b53">AssocMovieGenre</text><line x1="465" y1="360" x2="755" y2="360" stroke="#c3d1d7"/><text x="485" y="391" font-family="Arial,sans-serif" font-size="22" fill="#243b53">MovieId</text><text x="709" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">PK</text><line x1="465" y1="406" x2="755" y2="406" stroke="#c3d1d7"/><text x="485" y="437" font-family="Arial,sans-serif" font-size="22" fill="#243b53">GenreId</text><text x="709" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">PK</text><rect x="905" y="130" width="250" height="147" rx="7" fill="#fff0c8" stroke="#50768a" stroke-width="2"/><path d="M905 185 H1155" stroke="#50768a"/><text x="1030" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#243b53">Genre</text><line x1="905" y1="185" x2="1155" y2="185" stroke="#c3d1d7"/><text x="925" y="216" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Id</text><text x="1109" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">PK</text><line x1="905" y1="231" x2="1155" y2="231" stroke="#c3d1d7"/><text x="925" y="262" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Title</text><text x="1109" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#243b53">UQ</text><path d="M325 210 L465 383" stroke="#50768a" stroke-width="2.5" fill="none" /><path d="M755 429 L905 210" stroke="#50768a" stroke-width="2.5" fill="none" /><text x="600" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">PK: primary key     UQ: unique index</text><text x="600" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">MovieId and GenreId also reference the corresponding Id columns.</text></svg>