<rect x="176.0" y="1312" width="22" height="22" rx="5" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="206.0" y="1329" text-anchor="start" class="caption">Model session</text>
<rect x="336.0" y="1312" width="22" height="22" rx="5" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="366.0" y="1329" text-anchor="start" class="caption">Code check</text>
