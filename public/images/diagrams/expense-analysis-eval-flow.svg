<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1356" viewBox="0 0 640 1356" role="img" aria-labelledby="title desc">
<title id="title">Run each prompt repeatedly; let code grade</title><desc id="desc">The eval suite defines prompt variants, cases and checks. Each variant runs N times in isolated sessions. Every answer and event stream is saved. Amounts are extracted by a model and decided by code, tool use is read from the log by code, and judged checks use a rubric. Pass rates form a scorecard, and a pytest assertion passes only if every gated check meets its minimum pass rate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a8276"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1c1a17}.heading{font-size:24px;font-weight:650}.label{font-size:21px;font-weight:600}.detail{font-size:18px}.caption{font-size:17px;fill:#5c564c}.path{fill:none;stroke:#8a8276;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#8a8276;stroke-width:2}</style>
<rect width="100%" height="100%" rx="16" fill="#fdfcfa"/>
<text x="320.0" y="38" text-anchor="middle" class="heading">Run each prompt repeatedly; let code grade</text>
<rect x="22" y="62" width="596" height="104" rx="12" fill="#f8f1de" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="320.0" y="93" text-anchor="middle" class="label">Eval suite</text>
<text x="320.0" y="120" text-anchor="middle" class="detail">Prompt variants, cases, checks, minimum pass rates</text>
<text x="320.0" y="145" text-anchor="middle" class="detail">Expected values stay outside inputs/</text>
<path d="M320 166V193" class="path"/>
<rect x="22" y="193" width="596" height="79" rx="12" fill="#e8f0f7" stroke="#2b5c8a" stroke-width="1.5"/>
<text x="320.0" y="224" text-anchor="middle" class="label">Run every prompt variant N times</text>
<text x="320.0" y="251" text-anchor="middle" class="detail">Each run gets a fresh folder with only the inputs</text>
<path d="M320 272V294H116V316M320 294V316M320 294H524V316" class="line"/>
<path d="M116 316V319" class="path"/>
<path d="M320 316V319" class="path"/>
<path d="M524 316V319" class="path"/>
