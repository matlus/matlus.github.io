<text x="116.0" y="350" text-anchor="middle" class="label">Run 1</text>
<text x="116.0" y="377" text-anchor="middle" class="detail">Isolated session,</text>
<text x="116.0" y="402" text-anchor="middle" class="detail">same model, effort</text>
<rect x="226" y="319" width="188" height="104" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="320.0" y="350" text-anchor="middle" class="label">Run 2</text>
<text x="320.0" y="377" text-anchor="middle" class="detail">Isolated session,</text>
<text x="320.0" y="402" text-anchor="middle" class="detail">same model, effort</text>
<rect x="430" y="319" width="188" height="104" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="524.0" y="350" text-anchor="middle" class="label">Run N</text>
<text x="524.0" y="377" text-anchor="middle" class="detail">Isolated session,</text>
<text x="524.0" y="402" text-anchor="middle" class="detail">same model, effort</text>
<path d="M116 423V445H524V423M320 423V445" class="line"/>
<path d="M320 445V470" class="path"/>
<rect x="22" y="470" width="596" height="79" rx="12" fill="#f8f1de" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="320.0" y="501" text-anchor="middle" class="label">Saved for every run</text>
<text x="320.0" y="528" text-anchor="middle" class="detail">The final answer and the tool-call event stream</text>
<path d="M320 549V571H116V589M320 571H524V589M320 571V589" class="line"/>
<text x="116" y="609" text-anchor="middle" class="caption">Amount checks</text>
<text x="320" y="609" text-anchor="middle" class="caption">Tool-use checks</text>
<text x="524" y="609" text-anchor="middle" class="caption">Judged checks</text>
<path d="M116 621V635" class="path"/>
<path d="M320 621V635" class="path"/>
<path d="M524 621V635" class="path"/>
<rect x="22" y="635" width="188" height="104" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="116.0" y="666" text-anchor="middle" class="label">Extract facts</text>
<text x="116.0" y="693" text-anchor="middle" class="detail">A model fills</text>
<text x="116.0" y="718" text-anchor="middle" class="detail">a JSON schema</text>
<path d="M116 739V766" class="path"/>
<rect x="22" y="766" width="188" height="104" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="116.0" y="797" text-anchor="middle" class="label">Code decides</text>
<text x="116.0" y="824" text-anchor="middle" class="detail">Accepted amount,</text>
<text x="116.0" y="849" text-anchor="middle" class="detail">within one cent</text>
<path d="M320 635V766" class="path"/>
<rect x="226" y="766" width="188" height="104" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="320.0" y="797" text-anchor="middle" class="label">Code reads log</text>
<text x="320.0" y="824" text-anchor="middle" class="detail">Did a Python</text>
<text x="320.0" y="849" text-anchor="middle" class="detail">command run?</text>
<path d="M524 635V766" class="path"/>
<rect x="430" y="766" width="188" height="104" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="524.0" y="797" text-anchor="middle" class="label">Judge</text>
<text x="524.0" y="824" text-anchor="middle" class="detail">A model applies</text>
<text x="524.0" y="849" text-anchor="middle" class="detail">a written rubric</text>
<path d="M116 870V892H524V870M320 870V892" class="line"/>
<path d="M320 892V917" class="path"/>
<rect x="22" y="917" width="596" height="104" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="320.0" y="948" text-anchor="middle" class="label">Scorecard</text>
<text x="320.0" y="975" text-anchor="middle" class="detail">A pass rate for every check and prompt variant</text>
<text x="320.0" y="1000" text-anchor="middle" class="detail">Errored runs count as misses, listed separately</text>
<path d="M320 1021V1048" class="path"/>
<rect x="22" y="1048" width="596" height="79" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="320.0" y="1079" text-anchor="middle" class="label">Gate: an ordinary pytest assertion</text>
<text x="320.0" y="1106" text-anchor="middle" class="detail">Every gated check meets its minimum pass rate</text>
<path d="M320 1127V1149H167V1171M320 1149H473V1171" class="line"/>
<path d="M167 1171V1174" class="path"/>
<path d="M473 1171V1174" class="path"/>
<rect x="22" y="1174" width="290" height="104" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="167.0" y="1205" text-anchor="middle" class="label">Passes</text>
<text x="167.0" y="1232" text-anchor="middle" class="detail">Rely on it, knowing</text>
<text x="167.0" y="1257" text-anchor="middle" class="detail">the measured rates</text>
<rect x="328" y="1174" width="290" height="104" rx="12" fill="#fbeceb" stroke="#a83232" stroke-width="1.5"/>
<text x="473.0" y="1205" text-anchor="middle" class="label">Fails</text>
<text x="473.0" y="1232" text-anchor="middle" class="detail">Scorecard names each</text>
<text x="473.0" y="1257" text-anchor="middle" class="detail">check below its minimum</text>
