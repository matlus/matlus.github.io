<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1188" viewBox="0 0 560 1188" role="img" aria-labelledby="title desc">
<title id="title">Python owns the execution path</title><desc id="desc">A fixed sequence with narrow model calls. Parsing can leave unresolved fields; categorization fans out and gathers in source order. Reconciliation and totals must pass checks before verified findings and the rendered report.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a8276"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1c1a17}.heading{font-size:24px;font-weight:650}.label{font-size:21px;font-weight:600}.detail{font-size:18px}.path{fill:none;stroke:#8a8276;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="100%" height="100%" rx="16" fill="#fdfcfa"/>
<text x="280" y="38" text-anchor="middle" class="heading">Python owns the execution path</text>
<rect x="24" y="62" width="512" height="76" rx="12" fill="#e8f0f7" stroke="#2b5c8a" stroke-width="1.5"/>
<text x="280.0" y="93" text-anchor="middle" class="label">1. Validate input</text>
<text x="280.0" y="120" text-anchor="middle" class="detail">Preserve source lines and their positions</text>
<path d="M280 138V167" class="path"/>
<rect x="24" y="174" width="512" height="94" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="280.0" y="205" text-anchor="middle" class="label">2. Parse and resolve fields</text>
<text x="280.0" y="232" text-anchor="middle" class="detail">Python → eligible Jev choices → LLM fallback</text>
<text x="280.0" y="256" text-anchor="middle" class="detail">Code checks evidence; unknowns stay visible</text>
<path d="M280 268V297" class="path"/>
<rect x="24" y="304" width="512" height="94" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="280.0" y="335" text-anchor="middle" class="label">3. Fan out category tasks</text>
<text x="280.0" y="362" text-anchor="middle" class="detail">Complete lines: Jev choice → Python policy</text>
<text x="280.0" y="386" text-anchor="middle" class="detail">Incomplete lines: keep an empty slot</text>
<path d="M280 398V427" class="path"/>
<rect x="24" y="434" width="512" height="76" rx="12" fill="#e8f0f7" stroke="#2b5c8a" stroke-width="1.5"/>
<text x="280.0" y="465" text-anchor="middle" class="label">4. Gather in source order</text>
<text x="280.0" y="492" text-anchor="middle" class="detail">One categorization slot per source line</text>
<path d="M280 510V539" class="path"/>
<rect x="24" y="546" width="512" height="94" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="280.0" y="577" text-anchor="middle" class="label">5. Reconcile the ledger</text>
<text x="280.0" y="604" text-anchor="middle" class="detail">Apply confirmed duplicates and treatments</text>
<text x="280.0" y="628" text-anchor="middle" class="detail">Every source line remains accounted for</text>
<path d="M280 640V669" class="path"/>
<rect x="24" y="676" width="512" height="94" rx="12" fill="#e6f2f1" stroke="#0f6f6b" stroke-width="1.5"/>
<text x="280.0" y="707" text-anchor="middle" class="label">6. Calculate and check</text>
<text x="280.0" y="734" text-anchor="middle" class="detail">Decimal totals, budgets, and changes</text>
<text x="280.0" y="758" text-anchor="middle" class="detail">Require line and amount reconciliation</text>
<path d="M280 770V799" class="path"/>
<rect x="24" y="806" width="512" height="94" rx="12" fill="#f2ebf8" stroke="#7a4a9e" stroke-width="1.5"/>
<text x="280.0" y="837" text-anchor="middle" class="label">7. Select verified findings</text>
<text x="280.0" y="864" text-anchor="middle" class="detail">Python prepares evidence → LLM selects IDs</text>
<text x="280.0" y="888" text-anchor="middle" class="detail">Code checks IDs and copies fixed statements</text>
<path d="M280 900V929" class="path"/>
<rect x="24" y="936" width="512" height="76" rx="12" fill="#f8f1de" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="280.0" y="967" text-anchor="middle" class="label">8. Render the report</text>
<text x="280.0" y="994" text-anchor="middle" class="detail">Python formats the structured result</text>
<rect x="24" y="1064" width="512" height="96" rx="12" fill="#fbeceb" stroke="#a83232"/>
<text x="280" y="1092" text-anchor="middle" class="label">Failure behavior is part of the path</text>
<text x="280" y="1119" text-anchor="middle" class="detail">Unresolved extraction stays in the ledger.</text>
<text x="280" y="1144" text-anchor="middle" class="detail">Later unrecoverable failures stop completion.</text>
</svg>
