<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Keep logging context in the adapter</title><desc id="desc">Application passes a DTO; adapter checks level, constructs eightfield state, calls generic logger with event ID. Provider reads structure and formatter.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536879" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="740" rx="20" fill="#faf8f3"/>
<g font-family="Arial, sans-serif" fill="#263747"><text x="40" y="47" text-anchor="start" font-size="27" font-weight="600">Keep logging context in the adapter</text><rect x="45" y="105" width="320" height="130" rx="12" fill="#dceaf7" stroke="#677482" stroke-width="1.5"/><text x="205.0" y="163.0" text-anchor="middle" font-size="21" font-weight="400">Application code</text><text x="205.0" y="191.0" text-anchor="middle" font-size="21" font-weight="400">event + method + BlogPost</text><rect x="445" y="105" width="320" height="130" rx="12" fill="#dcece3" stroke="#677482" stroke-width="1.5"/><text x="605.0" y="163.0" text-anchor="middle" font-size="21" font-weight="400">ApplicationLogger</text><text x="605.0" y="191.0" text-anchor="middle" font-size="21" font-weight="400">check IsEnabled(Debug)</text><path d="M365 170 L435 170" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 235 L605 290" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="305" width="430" height="130" rx="12" fill="#fae4d4" stroke="#677482" stroke-width="1.5"/><text x="605.0" y="349.0" text-anchor="middle" font-size="21" font-weight="400">BlogLogState</text><text x="605.0" y="377.0" text-anchor="middle" font-size="21" font-weight="400">8 structured fields</text><text x="605.0" y="405.0" text-anchor="middle" font-size="21" font-weight="400">formatter for display text</text><path d="M820 370 L895 370" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="910" y="305" width="245" height="130" rx="12" fill="#e9e2f3" stroke="#677482" stroke-width="1.5"/><text x="1032.5" y="363.0" text-anchor="middle" font-size="21" font-weight="400">ILogger.Log</text><text x="1032.5" y="391.0" text-anchor="middle" font-size="21" font-weight="400">event ID + state</text><path d="M1030 435 L1030 520" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="535" width="340" height="110" rx="12" fill="#dceaf7" stroke="#677482" stroke-width="1.5"/><text x="995.0" y="583.1666666666666" text-anchor="middle" font-size="20" font-weight="400">Provider</text><text x="995.0" y="610.1666666666666" text-anchor="middle" font-size="20" font-weight="400">fields and formatted message</text><text x="230" y="540" text-anchor="middle" font-size="21" font-weight="400">Disabled? Stop before</text><text x="230" y="574" text-anchor="middle" font-size="21" font-weight="400">building the state.</text><text x="600" y="700" text-anchor="middle" font-size="20" font-weight="400">The provider decides how structured values are represented at the destination.</text></g></svg>