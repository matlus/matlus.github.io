<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Source dependencies and runtime calls</title><desc id="desc">Before inversion the domain references the SQL store. After inversion domain and SQL implementation reference the domain-owned contract. Runtime calls still travel to the selected store.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f8faf8"/><text x="600" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243b53" text-anchor="middle" font-weight="600">Source dependencies and runtime calls</text><text x="600" y="94" font-family="Arial,sans-serif" font-size="19" fill="#243b53" text-anchor="middle" font-weight="600">BEFORE</text><rect x="93" y="121" width="330" height="77" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="90" y="115" width="330" height="77" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="255" y="146" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Domain manager</text><rect x="783" y="121" width="330" height="77" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="780" y="115" width="330" height="77" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="945" y="146" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">SqlShowStore</text><path d="M420 151 L780 151" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="600" y="139" font-family="Arial,sans-serif" font-size="17" fill="#243b53" text-anchor="middle" font-weight="400">references</text><line x1="70" y1="240" x2="1130" y2="240" stroke="#cedde3"/><text x="600" y="286" font-family="Arial,sans-serif" font-size="19" fill="#243b53" text-anchor="middle" font-weight="600">AFTER</text><rect x="78" y="356" width="300" height="86" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="75" y="350" width="300" height="86" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="225" y="381" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Domain manager</text><text x="225" y="408" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">references the contract</text><rect x="453" y="356" width="300" height="86" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="450" y="350" width="300" height="86" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="381" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">ShowStoreBase</text><text x="600" y="408" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">domain-owned contract</text><rect x="828" y="356" width="300" height="86" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="825" y="350" width="300" height="86" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="975" y="381" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">SqlShowStore</text><text x="975" y="408" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">implements the contract</text><path d="M375 393 L450 393" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M825 393 L750 393" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M225 436 V536 H975 V436" stroke="#50768a" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/><text x="600" y="516" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Runtime dispatch reaches the selected implementation</text><text x="600" y="609" font-family="Arial,sans-serif" font-size="20" fill="#243b53" text-anchor="middle" font-weight="400">Solid arrows: source references. Dashed arrow: runtime call.</text></svg>