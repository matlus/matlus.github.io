<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Dependency inversion: system architecture</title><desc id="desc">A dashed system boundary contains two Domain Facade surfaces, three managers and three data managers. Service Interface Layer and database remain outside. Manager-B uses Configuration Provider, Gateway, Validator, the central Domain Facade, Emailer and Publisher. Data Manager-B uses Command Factory, Model Adapter, Data Record Adapter and the database.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f8faf8" stroke="#50768a"/></marker></defs><rect width="1440" height="760" rx="16" fill="#f8faf8"/><text x="720" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#243b53">Dependency inversion: system architecture</text><rect x="180" y="100" width="1070" height="595" fill="none" stroke="#6b9eb4" stroke-width="2" stroke-dasharray="9 6"/><rect x="20" y="290" width="130" height="145" rx="8" fill="#e1edf7" stroke="#50768a" stroke-width="1.8"/><text x="85" y="344.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Service</text><text x="85" y="369.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Interface</text><text x="85" y="394.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Layer</text><rect x="200" y="125" width="85" height="545" rx="8" fill="#dcf0e7" stroke="#50768a" stroke-width="1.8"/><text x="242.5" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Domain</text><text x="242.5" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Facade</text><rect x="360" y="135" width="165" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="442.5" y="189.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Manager-A</text><rect x="360" y="350" width="165" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="442.5" y="404.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Manager-B</text><rect x="360" y="575" width="165" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="442.5" y="629.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Manager-C</text><rect x="640" y="135" width="140" height="60" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="710" y="159.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Configuration</text><text x="710" y="184.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Provider</text><rect x="640" y="210" width="140" height="50" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="710" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Gateway</text><rect x="640" y="278" width="140" height="50" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="710" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Validator</text><rect x="675" y="352" width="80" height="110" rx="8" fill="#dcf0e7" stroke="#50768a" stroke-width="1.8"/><text x="715" y="401.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Domain</text><text x="715" y="426.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Facade</text><rect x="640" y="555" width="140" height="50" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="710" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Emailer</text><rect x="640" y="622" width="140" height="50" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="710" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Publisher</text><rect x="920" y="135" width="170" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="1005" y="189.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Data Manager-A</text><rect x="920" y="350" width="170" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="1005" y="404.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Data Manager-B</text><rect x="920" y="575" width="170" height="95" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="1005" y="629.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Data Manager-C</text><rect x="1140" y="135" width="95" height="65" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="1187.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Command</text><text x="1187.5" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Factory</text><rect x="1140" y="555" width="95" height="55" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="1187.5" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Model</text><text x="1187.5" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Adapter</text><rect x="1140" y="615" width="95" height="74" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="1187.5" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Data</text><text x="1187.5" y="659" text-anchor="middle" font-family="Arial,sans-serif" font-size="20"