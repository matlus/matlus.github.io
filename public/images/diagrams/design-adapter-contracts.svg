<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Two contracts, two broker implementations</title><desc id="desc">The application uses publisher and subscriber bases. RabbitMQ and Service Bus descendants implement them and own their provider SDK objects.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker></defs><rect width="1200" height="740" rx="20" fill="#f8faf8"/><text x="600" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243b53" text-anchor="middle" font-weight="600">Two contracts, two broker implementations</text><rect x="393" y="91" width="420" height="74" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="390" y="85" width="420" height="74" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="116" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Application caller</text><text x="600" y="143" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Publish • Subscribe • Acknowledge</text><rect x="78" y="241" width="480" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="75" y="235" width="480" height="80" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="315" y="266" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">MessageBrokerPublisherBase</text><text x="315" y="293" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Publish(Message)</text><rect x="648" y="241" width="480" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="645" y="235" width="480" height="80" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="885" y="266" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">MessageBrokerSubscriberBase</text><text x="885" y="293" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Subscribe(callback) • Acknowledge(token)</text><path d="M490 159 V192 H315 V235" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M710 159 V192 H885 V235" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="600" y="211" font-family="Arial,sans-serif" font-size="17" fill="#243b53" text-anchor="middle" font-weight="400">caller uses contracts</text><rect x="38" y="426" width="260" height="104" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="35" y="420" width="260" height="104" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="165" y="451" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">RabbitMQ publisher</text><text x="165" y="478" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">implements publisher base</text><text x="165" y="505" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">owns IConnection</text><rect x="323" y="426" width="260" height="104" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="320" y="420" width="260" height="104" rx="15" fill="#f9dfd7" stroke="#7191a8" stroke-width="1.5"/><text x="450" y="451" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Service Bus publisher</text><text x="450" y="478" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">implements publisher base</text><text x="450" y="505" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">owns TopicClient</text><rect x="623" y="426" width="260" height="104" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="620" y="420" width="260" height="104" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="750" y="451" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">RabbitMQ subscriber</text><text x="750" y="478" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">implements subscriber base</text><text x="750" y="505" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">owns channel + consumer</text><rect x="908" y="426" width="260" height="104" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="905" y="420" width="260" height="104" rx="15" fill="#f9dfd7" stroke="#7191a8" stroke-width="1.5"/><text x="1035" y="451" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Service Bus subscriber</text><text x="1035" y="478" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">implements subscriber base</text><text x="1035" y="505" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">owns SubscriptionClient</text><path d="M165 420 V366 H265 V315" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M450 420 V366 H365 V315" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M750 420 V366 H835 V315" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M1035 420 V366 H935 V315" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="315" y="393" font-family="Arial,sans-serif" font-size="17" fill="#243b53" text-anchor="middle" font-weight="400">implements</text><text x="885" y="393" font-family="Arial,sans-serif" font-size="17" fill="#243b53" text-anchor="middle" font-weight="400">implements</text><rect x="78" y="600" width="1050" height="98" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="75" y="594" width="1050" height="98" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="625" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Application-owned data crosses the boundary</text><text x="600" y="652" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Message and MessageReceivedEventArgs stay independent of either SDK.</text><text x="600" y="568" font-family="Arial,sans-serif" font-size="20" fill="#243b53" text-anchor="middle" font-weight="400">Provider SDK objects remain inside their concrete adapter.</text></svg>