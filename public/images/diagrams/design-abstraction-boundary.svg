<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">A publishing contract in application language</title><desc id="desc">The application supplies its own Message through the publisher contract. Concrete adapters map it to RabbitMQ or Service Bus types inside the provider boundary.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker></defs><rect width="1200" height="580" rx="20" fill="#f8faf8"/><text x="600" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243b53" text-anchor="middle" font-weight="600">A publishing contract in application language</text><rect x="388" y="101" width="430" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="385" y="95" width="430" height="80" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="126" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Application Message</text><text x="600" y="153" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">body • identifiers • metadata</text><path d="M600 175 L600 229" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="388" y="236" width="430" height="75" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="385" y="230" width="430" height="75" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="261" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Publish(Message)</text><text x="600" y="288" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">application-facing contract</text><path d="M490 305 V346 H295 V385" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M710 305 V346 H905 V385" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="78" y="391" width="440" height="113" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="75" y="385" width="440" height="113" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="295" y="416" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">RabbitMQ adapter</text><text x="295" y="443" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">maps to BasicProperties + body</text><text x="295" y="470" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">uses channel.BasicPublish</text><rect x="688" y="391" width="440" height="113" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="685" y="385" width="440" height="113" rx="15" fill="#f9dfd7" stroke="#7191a8" stroke-width="1.5"/><text x="905" y="416" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Service Bus adapter</text><text x="905" y="443" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">maps to Service Bus Message</text><text x="905" y="470" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">uses TopicClient.SendAsync</text><text x="600" y="550" font-family="Arial,sans-serif" font-size="22" fill="#243b53" text-anchor="middle" font-weight="400">SDK types are confined to the implementations.</text></svg>