<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Adapter design pattern</title><desc id="desc">Client depends on Adapter (interface). Implementation 1 and Implementation 2 inherit the Adapter contract and compose Adaptee 1 and Adaptee 2 respectively. Source node placement and diamond positions are retained.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f8faf8" stroke="#50768a"/></marker></defs><rect width="1200" height="480" rx="16" fill="#f8faf8"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#243b53">Adapter design pattern</text><rect x="65" y="105" width="210" height="86" rx="8" fill="#f9dfd7" stroke="#50768a" stroke-width="1.8"/><text x="170" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Client</text><rect x="510" y="105" width="230" height="86" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="625" y="142.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">Adapter</text><text x="625" y="167.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#243b53">(interface)</text><path d="M275 148 H510" stroke="#50768a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="330" width="210" height="76" rx="8" fill="#dcf0e7" stroke="#50768a" stroke-width="1.8"/><text x="170" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Adaptee 1</text><rect x="360" y="310" width="220" height="110" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="470" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Implementation 1</text><rect x="690" y="310" width="220" height="110" rx="8" fill="#fff0c8" stroke="#50768a" stroke-width="1.8"/><text x="800" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Implementation 2</text><rect x="990" y="330" width="170" height="76" rx="8" fill="#dcf0e7" stroke="#50768a" stroke-width="1.8"/><text x="1075" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#243b53">Adaptee 2</text><path d="M470 310 C470 240 625 270 625 191" stroke="#50768a" stroke-width="2.5" fill="none" marker-end="url(#triangle)"/><path d="M800 310 C800 240 625 270 625 191" stroke="#50768a" stroke-width="2.5" fill="none" marker-end="url(#triangle)"/><path d="M360 368 H287" stroke="#50768a" stroke-width="2.5" fill="none" /><path d="M275 368 L287 356 L299 368 L287 380 Z" fill="#50768a"/><path d="M910 368 H978" stroke="#50768a" stroke-width="2.5" fill="none" /><path d="M966 368 L978 356 L990 368 L978 380 Z" fill="#50768a"/></svg>