<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc">
<title id="title">An illustrative four-core cache model</title><desc id="desc">Four cores each have instruction cache 32 KB, L1 data cache 64 KB, and L2 256 KB. L3 4 to24 MB is shared; DRAM above. Two 10-stage pipeline labels flank cores.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536879" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="668" rx="20" fill="#faf8f3"/>
