<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Two paths to the same application operation</title><desc id="desc">Conceptual terminal delegate versus controller pipeline. Both use the same domain operation; serialization responsibility differs.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536879" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#faf8f3"/>
<g font-family="Arial, sans-serif" fill="#263747"><text x="40" y="47" text-anchor="start" font-size="27" font-weight="600">Two paths to the same application operation</text><rect x="40" y="195" width="190" height="100" rx="12" fill="#dceaf7" stroke="#677482" stroke-width="1.5"/><text x="135.0" y="251.66666666666666" text-anchor="middle" font-size="20" font-weight="400">HTTP request</text><rect x="330" y="90" width="345" height="120" rx="12" fill="#dcece3" stroke="#677482" stroke-width="1.5"/><text x="502.5" y="143.16666666666666" text-anchor="middle" font-size="20" font-weight="400">Routing → controller</text><text x="502.5" y="170.16666666666666" text-anchor="middle" font-size="20" font-weight="400">call movie operation</text><rect x="330" y="375" width="345" height="120" rx="12" fill="#fae4d4" stroke="#677482" stroke-width="1.5"/><text x="502.5" y="428.1666666666667" text-anchor="middle" font-size="20" font-weight="400">Terminal app.Run</text><text x="502.5" y="455.1666666666667" text-anchor="middle" font-size="20" font-weight="400">check path; call operation</text><path d="M230 225 L320 150" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><path d="M230 260 L320 435" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="200" width="330" height="105" rx="12" fill="#e9e2f3" stroke="#677482" stroke-width="1.5"/><text x="980.0" y="245.66666666666666" text-anchor="middle" font-size="20" font-weight="400">Same Domain Facade</text><text x="980.0" y="272.66666666666663" text-anchor="middle" font-size="20" font-weight="400">same movie data operation</text><path d="M675 150 L805 220" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 435 L805 285" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="250" text-anchor="middle" font-size="19" font-weight="400">Framework result handling</text><text x="510" y="283" text-anchor="middle" font-size="19" font-weight="400">and serialization</text><text x="510" y="545" text-anchor="middle" font-size="19" font-weight="400">Handler writes JSON</text><text x="980" y="420" text-anchor="middle" font-size="21" font-weight="400">Both return movie data.</text><text x="980" y="454" text-anchor="middle" font-size="19" font-weight="400">Endpoint responsibilities</text><text x="980" y="482" text-anchor="middle" font-size="19" font-weight="400">must be compared too.</text></g></svg>