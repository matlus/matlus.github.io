<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">One benchmark case</title><desc id="desc">Parameters and setup precede warmup and measurement. Reports follow. Simplified BenchmarkDotNet lifecycle, not a precise list of all engine stages.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536879" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="540" rx="20" fill="#faf8f3"/>
<g font-family="Arial, sans-serif" fill="#263747"><text x="40" y="47" text-anchor="start" font-size="27" font-weight="600">One benchmark case</text><rect x="50" y="110" width="280" height="100" rx="12" fill="#dceaf7" stroke="#677482" stroke-width="1.5"/><text x="190.0" y="153.16666666666666" text-anchor="middle" font-size="20" font-weight="400">Select method</text><text x="190.0" y="180.16666666666666" text-anchor="middle" font-size="20" font-weight="400">and parameter values</text><rect x="460" y="110" width="280" height="100" rx="12" fill="#dcece3" stroke="#677482" stroke-width="1.5"/><text x="600.0" y="153.16666666666666" text-anchor="middle" font-size="20" font-weight="400">GlobalSetup</text><text x="600.0" y="180.16666666666666" text-anchor="middle" font-size="20" font-weight="400">prepare this case</text><rect x="870" y="110" width="280" height="100" rx="12" fill="#fae4d4" stroke="#677482" stroke-width="1.5"/><text x="1010.0" y="153.16666666666666" text-anchor="middle" font-size="20" font-weight="400">Warmup</text><text x="1010.0" y="180.16666666666666" text-anchor="middle" font-size="20" font-weight="400">repeat operation</text><path d="M330 160 L450 160" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><path d="M740 160 L860 160" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 210 L1010 310" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="870" y="325" width="280" height="100" rx="12" fill="#fae4d4" stroke="#677482" stroke-width="1.5"/><text x="1010.0" y="368.1666666666667" text-anchor="middle" font-size="20" font-weight="400">Measured invocations</text><text x="1010.0" y="395.1666666666667" text-anchor="middle" font-size="20" font-weight="400">consume results</text><path d="M870 375 L755 375" fill="none" stroke="#536879" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="325" width="280" height="100" rx="12" fill="#e9e2f3" stroke="#677482" stroke-width="1.5"/><text x="600.0" y="368.1666666666667" text-anchor="middle" font-size="20" font-weight="400">Report</text><text x="600.0" y="395.1666666666667" text-anchor="middle" font-size="20" font-weight="400">time and allocation</text><text x="255" y="360" text-anchor="middle" font-size="21" font-weight="400">Setup is outside the</text><text x="255" y="392" text-anchor="middle" font-size="21" font-weight="400">measured operation.</text><text x="600" y="495" text-anchor="middle" font-size="21" font-weight="400">Repeated invocations share case state unless the experiment explicitly resets it.</text></g></svg>