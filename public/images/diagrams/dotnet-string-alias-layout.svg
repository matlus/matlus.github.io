<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc"><title id="title">Strings: a new result, two references</title><desc id="desc">s2 retains the original Hello World string, length 0x000B. s1 refers to Hello World, Welcome, length 0x0014. There are nineteen original cells, twenty-eight result cells and four arrows.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#4a6d88"/></marker><style>text{font-family:system-ui,'Segoe UI',sans-serif;fill:#203d55}.code{font-family:Consolas,monospace}.arrow{fill:none;stroke:#4a6d88;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1300" height="900" rx="18" fill="#f7fafb"/><text x="55" y="65" font-size="31" font-weight="600">Strings: a new result, two references</text><rect x="620" y="110" width="625" height="255" rx="12" fill="#eaf8f0" stroke="#95b3c6"/><rect x="620" y="365" width="625" height="430" rx="12" fill="#edf6fb" stroke="#95b3c6"/><text x="925" y="153" text-anchor="middle" font-size="29">Stack</text><text x="645" y="196" font-size="23">Main</text><text x="730" y="407" text-anchor="middle" font-size="29">Heap</text><text x="55" y="250" font-size="24" class="code">string s1 = "Hello World";</text><text x="55" y="290" font-size="24" class="code">string s2 = s1;</text><text x="55" y="330" font-size="24" class="code">s1 += ", Welcome";</text><text x="435" y="260" font-size="23" class="">0x0161</text><path class="arrow" d="M540 252H635"/><text x="645" y="260" font-size="23" class="">s2 0x001513ec</text><text x="435" y="320" font-size="23" class="">0x015D</text><path class="arrow" d="M540 312H635"/><text x="645" y="320" font-size="23" class="">s1 0x00151400</text><path class="arrow" d="M825 258C1190 245 1190 417 1112 447"/><text x="645" y="456" font-size="21" class="">0x001513ec</text><rect class="memory-cell" x="825" y="430" width="35" height="35"