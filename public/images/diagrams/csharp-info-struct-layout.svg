<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
<title id="title">Info struct: conceptual memory layout</title>
<desc id="desc">The stack local info at 0x015D contains twenty-four conceptual cells in three rows of eight. The bottom row is zero. Name is initially null; the heap is empty.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#4a6d88"/></marker><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfcfc"/><stop offset="1" stop-color="#edf4f7"/></linearGradient><style>text{font-family:system-ui,'Segoe UI',sans-serif;fill:#203d55}.link{fill:none;stroke:#4a6d88;stroke-width:3;marker-end:url(#arrow)}.code{font-family:Consolas,monospace;font-size:23px}</style></defs>
<rect width="1300" height="900" rx="18" fill="url(#paper)"/>
<text x="65" y="70" font-size="32" font-weight="600">Info struct: before assigning Name</text>
<path d="M55 100H1245M55 810H1245" stroke="#d9e6ec"/>
<rect x="530" y="135" width="700" height="275" rx="12" fill="#eaf8f0" stroke="#95b3c6"/>
<rect x="530" y="410" width="700" height="350" rx="12" fill="#edf6fb" stroke="#95b3c6"/>
<text x="875" y="180" font-size="29" text-anchor="middle">Stack</text><text x="555" y="220" font-size="24">Main</text>
<text x="1110" y="455" font-size="29" text-anchor="middle">Heap</text>
<text class="code" x="70" y="190">Info info = new Info();</text>
<text class="code" x="70" y="225">info.Name = "Hello";</text>
<rect x="60" y="163" width="390" height="37" rx="5" fill="none" stroke="#d69a57" stroke-width="2"/>
<text class="code" x="70" y="495">internal struct Info</text><text class="code" x="70" y="535">{</text><text class="code" x="95" y="575">public int Id;</text><text class="code" x="95" y="615">public double Value;</text><text class="code" x="95" y="655">public DateTime Date;</text><text class="code" x="95" y="695">public string Name;</text><text class="code" x="70" y="735">}</text>
<text x="285" y="294" font-size="25">0x015D</text><path class="link" d="M390 285H540"/>
<text x="555" y="294" font-size="24">info</text>

