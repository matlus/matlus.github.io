<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc"><title id="title">One domain request, three provider responses</title><desc id="desc">The domain calls GetAllMovies. The gateway makes three concurrent provider requests, checks responses, joins fragments and maps them to domain Movie objects.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50768a" stroke-width="1.5"/></marker></defs><rect width="1200" height="695" rx="20" fill="#f8faf8"/><text x="600" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243b53" text-anchor="middle" font-weight="600">One domain request, three provider responses</text><rect x="48" y="112" width="325" height="87" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="45" y="106" width="325" height="87" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="207.5" y="137" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">WithCategories.json</text><text x="207.5" y="164" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Title + Category</text><rect x="441" y="112" width="325" height="87" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="438" y="106" width="325" height="87" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="600.5" y="137" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">WithImageUrls.json</text><text x="600.5" y="164" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Title + ImageUrl</text><rect x="833" y="112" width="325" height="87" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="830" y="106" width="325" height="87" rx="15" fill="#e1edf7" stroke="#7191a8" stroke-width="1.5"/><text x="992.5" y="137" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">WithYears.json</text><text x="992.5" y="164" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Title + Year</text><path d="M207 193 L207 260" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M600 193 L600 260" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M992 193 L992 260" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="70" y="263" width="1060" height="237" rx="22" fill="#edf7f1" stroke="#7191a8" stroke-width="2" stroke-dasharray="9 6"/><text x="600" y="301" font-family="Arial,sans-serif" font-size="23" fill="#243b53" text-anchor="middle" font-weight="600">GATEWAY</text><text x="600" y="345" font-family="Arial,sans-serif" font-size="23" fill="#243b53" text-anchor="middle" font-weight="400">Request concurrently → Check responses → Join → Map</text><rect x="308" y="386" width="590" height="84" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="305" y="380" width="590" height="84" rx="15" fill="#dcf0e7" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="411" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Domain Movie</text><text x="600" y="438" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">Title • ImageUrl • Genre (enum) • Year</text><path d="M600 500 L600 564" stroke="#50768a" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="600" y="520" font-family="Arial,sans-serif" font-size="17" fill="#243b53" text-anchor="middle" font-weight="400">returns</text><rect x="388" y="571" width="430" height="80" rx="15" fill="#d5e0e6" opacity=".45"/><rect x="385" y="565" width="430" height="80" rx="15" fill="#fff0c8" stroke="#7191a8" stroke-width="1.5"/><text x="600" y="596" font-family="Arial,sans-serif" font-size="21" fill="#243b53" text-anchor="middle" font-weight="600">Domain caller</text><text x="600" y="623" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">GetAllMovies()</text><text x="600" y="675" font-family="Arial,sans-serif" font-size="18" fill="#243b53" text-anchor="middle" font-weight="400">The diagram shows returned data; request details stay inside the gateway.</text></svg>